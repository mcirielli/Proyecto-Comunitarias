spring.application.name=comunitarias
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# No crear usuario/contraseña aleatorios de Spring Security. Login pendiente.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Habilitar solo después de aplicar la migración de compras expresamente autorizada.
app.compras.enabled=${COMPRAS_ENABLED:false}
app.inventario.enabled=${INVENTARIO_ENABLED:false}
