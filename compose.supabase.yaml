# Aplicar junto con compose.yaml; las credenciales se toman del entorno o .env.
services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: supabase
      SUPABASE_JDBC_URL: ${SUPABASE_JDBC_URL:?Definir SUPABASE_JDBC_URL con SSL}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:?Definir SUPABASE_DB_USER}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:?Definir SUPABASE_DB_PASSWORD}
