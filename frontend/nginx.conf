server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver Docker: el proxy vuelve a resolver backend si se recrea el contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        set $backend_address backend:8080;
        # request_uri conserva /api/ y los parámetros; no quitar el prefijo.
        proxy_pass http://$backend_address$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        # Mantener los estados HTTP del backend: no devolver index.html ante 401/403.
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
