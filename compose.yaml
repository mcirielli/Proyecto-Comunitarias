name: comunitarias

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Primer arranque exclusivamente dev, aunque la terminal tenga otro perfil.
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_HOST_PORT:-8081},http://127.0.0.1:${FRONTEND_HOST_PORT:-8081},http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - comunitarias
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - comunitarias
    healthcheck:
      # Comprueba Nginx/archivos estáticos; la API se valida por separado.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  comunitarias:
    driver: bridge
